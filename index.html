<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Buddy - Home</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <header class="navbar container">
      <a href="index.html" class="logo">
        <img src="images/logo-character.png" width="40" alt="Study Buddy" />
        STUDY BUDDY
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="groups.html">Groups</a>
        <a href="chat.html">Chat</a>
        <a href="notices.html">Notices</a>
        <a href="mypage.html">My Page</a>
        <a href="signup.html">Sign-Up</a>
        <a href="admin.html">Admin</a>
      </nav>
    </header>

    <section class="banner container">
      <div>
        <h1>Find Your Perfect Study Buddy</h1>
        <p>Connect, collaborate, and achieve your academic goals together!</p>
        <button class="btn btn-accent" onclick="openModal()">
          Sign Up Now
        </button>
      </div>
      <img src="images/logo.png" alt="Study Buddy Banner" />
    </section>

    <footer class="footer container">© 2025 Study Buddy</footer>

    <!-- Sign-Up Modal -->
    <div class="modal" id="signupModal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Sign Up</h2>
        <input type="text" id="name" placeholder="Your Name" />
        <input type="email" id="email" placeholder="Email" />
        <select id="schedule">
          <option value="">Select schedule</option>
          <option>Morning</option>
          <option>Afternoon</option>
          <option>Evening</option>
        </select>
        <button class="btn btn-accent" onclick="signup()">Sign Up</button>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
