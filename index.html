    <!-- style -->

    <!-- js -->
    <script src="js/main.js"></script>

<body>
    <!-- header -->
    <header class="navbar">
        <div class="container">
            <a href="./index.html" class="logo">
                <div>
                    <img src="./images/logo-character.png" alt="study buddy" width="100%" height="100%" style="object-fit: cover;"/>
                </div>

            <!-- Menu Icon: 900px -->
            <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
            <label for="nav-toggle" class="hamburger" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </label>

            <nav id="site-menu">
                <a href="./index.html" aria-current="page">Home</a>
                <a href="./group.html">Current Group</a>

    <main class="container">

        <div class="grid grid-3">
            <section class="card bg-lavender">

            <section class="card">

                <button class="btn border-mint">Make a Group</button>

    <footer class="footer container">
